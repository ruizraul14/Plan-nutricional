<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan Nutricional · Raúl & Carmen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ── */
:root {
  --bg:        #fafaf8;
  --surface:   #ffffff;
  --surface2:  #f5f4f0;
  --surface3:  #eeede8;
  --border:    #e8e6e0;
  --border-md: #d4d0c8;
  --green:     #2d6a2d;
  --green-lt:  #e8f5e8;
  --green-mid: #4a8c4a;
  --orange:    #b45309;
  --orange-lt: #fff7ed;
  --blue:      #1e40af;
  --blue-lt:   #eff6ff;
  --rose:      #9d174d;
  --rose-lt:   #fdf2f8;
  --text:      #1c1917;
  --text-2:    #44403c;
  --text-3:    #78716c;
  --text-4:    #a8a29e;
  --raul:      #1e40af;
  --raul-bg:   #eff6ff;
  --carmen:    #9d174d;
  --carmen-bg: #fdf2f8;
  --fav:       #b45309;
  --done:      #2d6a2d;
  --r:         16px;
  --r-sm:      10px;
  --r-xs:      6px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow:    0 4px 16px rgba(0,0,0,.07), 0 1px 4px rgba(0,0,0,.04);
  --shadow-lg: 0 20px 60px rgba(0,0,0,.12), 0 4px 16px rgba(0,0,0,.06);
  --max-w:     1200px;
  --sidebar-w: 280px;
}

/* ── RESET ── */
*, *::before, *::after { box-sizing: border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  font-weight: 400;
  line-height: 1.6;
  min-height: 100vh;
}
button { font-family: inherit; cursor: pointer; }
input  { font-family: inherit; }

/* ── APP SHELL (desktop: sidebar + main) ── */
.app-shell {
  display: flex;
  min-height: 100vh;
}

/* ── SIDEBAR ── */
.sidebar {
  width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  flex-shrink: 0;
  z-index: 50;
}
.sidebar-brand {
  padding: 28px 24px 20px;
  border-bottom: 1px solid var(--border);
}
.sidebar-brand h1 {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.25rem;
  font-weight: 600;
  color: var(--green);
  line-height: 1.2;
  margin-bottom: 4px;
}
.sidebar-brand .sub {
  font-size: 0.72rem;
  color: var(--text-4);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-weight: 500;
}
.sidebar-search {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}
.search-input-wrap { position: relative; }
.search-input-wrap input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  color: var(--text);
  font-size: 0.85rem;
  padding: 9px 14px 9px 36px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.search-input-wrap input:focus {
  border-color: var(--green);
  box-shadow: 0 0 0 3px rgba(45,106,45,.08);
}
.search-input-wrap input::placeholder { color: var(--text-4); }
.search-ico {
  position: absolute; left: 11px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-4); font-size: 0.9rem; pointer-events: none;
}
.sidebar-nav {
  padding: 16px 12px;
  flex: 1;
}
.nav-section-label {
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-4);
  padding: 0 12px;
  margin-bottom: 6px;
  margin-top: 16px;
}
.nav-btn {
  display: flex; align-items: center; gap: 10px;
  width: 100%; background: none; border: none;
  color: var(--text-3); font-size: 0.875rem; font-weight: 500;
  padding: 9px 12px; border-radius: var(--r-sm);
  transition: all .15s; text-align: left;
}
.nav-btn:hover { background: var(--surface2); color: var(--text); }
.nav-btn.active { background: var(--green-lt); color: var(--green); font-weight: 600; }
.nav-btn .icon { font-size: 1rem; width: 20px; text-align: center; }
.week-divider { height: 1px; background: var(--border); margin: 10px 12px; }

/* ── MAIN CONTENT ── */
.main-content {
  flex: 1;
  min-width: 0;
  overflow-y: auto;
  height: 100vh;
  padding: 0;
}
.content-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 24px 40px;
  position: sticky;
  top: 0;
  z-index: 40;
}
.content-header h2 {
  font-family: 'Playfair Display', serif;
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.01em;
}
.content-header .breadcrumb {
  font-size: 0.78rem;
  color: var(--text-4);
  margin-bottom: 4px;
}
.content-body {
  padding: 32px 40px;
  max-width: 960px;
}

/* ── VIEWS ── */
.view { display: none; }
.view.active { display: block; }

/* ── WEEK PLAN — day cards ── */
.plan-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 32px;
}
@media (max-width: 800px) { .plan-grid { grid-template-columns: 1fr; } }

.day-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .2s;
}
.day-card:hover { box-shadow: var(--shadow); }
.day-header {
  padding: 14px 18px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.day-name {
  font-family: 'Playfair Display', serif;
  font-size: 1rem; font-weight: 600;
  color: var(--green);
}
.day-done { font-size: 0.72rem; color: var(--text-4); }
.meals-list { padding: 8px 0; }
.meal-row {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 10px 18px; cursor: pointer;
  transition: background .15s; border-bottom: 1px solid var(--border);
  position: relative;
}
.meal-row:last-child { border-bottom: none; }
.meal-row:hover { background: var(--surface2); }
.meal-row.done { opacity: .55; }
.meal-row.done .meal-title { text-decoration: line-through; }
.meal-type-col {
  width: 76px; flex-shrink: 0; padding-top: 2px;
}
.meal-type-badge {
  font-size: 0.62rem; font-weight: 600; letter-spacing: 0.06em;
  text-transform: uppercase; padding: 2px 7px;
  border-radius: 4px; display: inline-block;
}
.badge-D  { background: #eff6ff; color: #1e40af; }
.badge-C  { background: #f0fdf4; color: #166534; }
.badge-M  { background: #fffbeb; color: #92400e; }
.badge-CE { background: #fdf4ff; color: #6b21a8; }
.meal-info { flex: 1; min-width: 0; }
.meal-title {
  font-size: 0.85rem; font-weight: 500; color: var(--text);
  line-height: 1.35; margin-bottom: 2px;
}
.meal-code { font-size: 0.68rem; color: var(--text-4); }
.meal-actions {
  display: flex; gap: 5px; flex-shrink: 0; padding-top: 1px;
}
.action-btn {
  background: none; border: 1px solid var(--border); border-radius: var(--r-xs);
  font-size: 0.7rem; padding: 3px 8px; color: var(--text-4); transition: all .15s;
}
.action-btn:hover { border-color: var(--green); color: var(--green); }
.action-btn.done-active { background: var(--green-lt); border-color: var(--green); color: var(--green); }
.action-btn.fav-active  { background: #fffbeb; border-color: var(--fav); color: var(--fav); }

/* ── RECIPE MODAL / DRAWER ── */
#recipe-modal {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(28,25,23,.45);
  backdrop-filter: blur(6px);
}
#recipe-modal.open { display: flex; align-items: flex-end; justify-content: flex-end; }
@media (min-width: 768px) {
  #recipe-modal.open { align-items: flex-start; }
}
.recipe-drawer {
  background: var(--surface);
  width: 100%;
  max-width: 560px;
  height: 100vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  animation: drawerIn .28s cubic-bezier(.16,1,.3,1);
}
@keyframes drawerIn {
  from { transform: translateX(40px); opacity:0; }
  to   { transform: translateX(0);    opacity:1; }
}
@media (max-width: 767px) {
  .recipe-drawer {
    max-width: 100%;
    height: 92vh;
    border-radius: var(--r) var(--r) 0 0;
    animation: drawerUp .28s cubic-bezier(.16,1,.3,1);
  }
  @keyframes drawerUp {
    from { transform: translateY(40px); opacity:0; }
    to   { transform: translateY(0);    opacity:1; }
  }
}
.drawer-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 14px auto 0; }
.drawer-header {
  padding: 20px 24px 18px;
  border-bottom: 1px solid var(--border);
  display: flex; gap: 16px; align-items: flex-start;
}
.drawer-title {
  flex: 1;
  font-family: 'Playfair Display', serif;
  font-size: 1.15rem; font-weight: 600;
  color: var(--text); line-height: 1.3;
}
.drawer-close {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--r-xs); color: var(--text-3); font-size: 0.9rem;
  padding: 6px 11px; flex-shrink: 0; transition: all .15s;
}
.drawer-close:hover { background: var(--surface3); color: var(--text); }

/* meta row */
.drawer-meta {
  display: flex; gap: 8px; flex-wrap: wrap;
  padding: 14px 24px; border-bottom: 1px solid var(--border);
}
.meta-pill {
  font-size: 0.75rem; font-weight: 500;
  padding: 4px 12px; border-radius: 20px;
  border: 1px solid var(--border);
}
.meta-pill.time   { background: #fff7ed; color: var(--orange); border-color: #fed7aa; }
.meta-pill.raul   { background: var(--raul-bg); color: var(--raul); border-color: #bfdbfe; }
.meta-pill.carmen { background: var(--carmen-bg); color: var(--carmen); border-color: #fbcfe8; }

/* drawer sections */
.drawer-section { padding: 20px 24px 0; }
.drawer-section:last-of-type { padding-bottom: 32px; }
.ds-label {
  font-size: 0.68rem; font-weight: 600; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text-4); margin-bottom: 12px;
}

/* ingredients two-col */
/* ── INGREDIENT COLUMNS ── */
.ingr-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ingr-col {
  border-radius: var(--r-sm);
  border: 1px solid var(--border);
  overflow: hidden;
}
.ingr-col.raul-col   { border-color: #bfdbfe; }
.ingr-col.carmen-col { border-color: #fbcfe8; }
.ingr-person-header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 13px 9px;
  border-bottom: 1px solid var(--border);
}
.ingr-person-header.r { background: var(--raul-bg); border-bottom-color: #bfdbfe; }
.ingr-person-header.c { background: var(--carmen-bg); border-bottom-color: #fbcfe8; }
.ingr-person-avatar {
  width: 22px; height: 22px; border-radius: 50%;
  font-size: 0.65rem; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; letter-spacing: 0;
}
.ingr-person-avatar.r { background: var(--raul); color: #fff; }
.ingr-person-avatar.c { background: var(--carmen); color: #fff; }
.ingr-person-name {
  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase;
}
.ingr-person-name.r { color: var(--raul); }
.ingr-person-name.c { color: var(--carmen); }
.ingr-person-kcal {
  font-size: 0.65rem; color: var(--text-4); margin-left: auto;
}
.ingr-list { padding: 10px 13px 12px; }
.ingr-item {
  font-size: 0.82rem; color: var(--text-2); padding: 4px 0;
  line-height: 1.35; display: flex; align-items: baseline; gap: 7px;
  border-bottom: 1px solid var(--border);
}
.ingr-item:last-child { border-bottom: none; padding-bottom: 0; }
.ingr-dot {
  width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0;
  margin-top: 5px;
}
.ingr-dot.r { background: var(--raul); }
.ingr-dot.c { background: var(--carmen); }

/* ── SHARED INGREDIENTS — table style ── */
.shared-block {
  margin-top: 12px;
  border: 1px solid #d1fae5;
  border-radius: var(--r-sm);
  overflow: hidden;
}
.shared-header {
  background: #ecfdf5; padding: 9px 14px;
  display: flex; align-items: center; gap: 8px;
  border-bottom: 1px solid #d1fae5;
}
.shared-header-icon { font-size: 0.9rem; }
.shared-header-text {
  font-size: 0.68rem; font-weight: 700; letter-spacing: 0.07em;
  text-transform: uppercase; color: var(--green);
}
.shared-header-sub {
  font-size: 0.63rem; color: #6ee7b7; margin-left: auto;
  font-weight: 500;
}
.shared-table { width: 100%; border-collapse: collapse; }
.shared-table td {
  padding: 7px 14px; font-size: 0.82rem; color: var(--text-2);
  border-bottom: 1px solid #d1fae5; vertical-align: middle;
}
.shared-table tr:last-child td { border-bottom: none; }
.shared-table td:first-child { width: 24px; padding-right: 6px; text-align: center; }
.shared-table td:last-child {
  text-align: right; font-size: 0.7rem; color: #6ee7b7; font-weight: 600;
  white-space: nowrap; padding-left: 4px;
}
.shared-equal-badge {
  display: inline-block; background: #d1fae5; color: var(--green);
  border-radius: 3px; font-size: 0.6rem; font-weight: 700;
  padding: 1px 5px; letter-spacing: 0.04em;
}

/* ── VEGGIE SELECTOR — inside ingredients ── */
.veggie-selector {
  margin-top: 12px;
  border: 1px solid #fde68a;
  border-radius: var(--r-sm);
  overflow: hidden;
}
.veggie-selector-header {
  background: #fffbeb; padding: 9px 14px;
  display: flex; align-items: center; gap: 8px;
  border-bottom: 1px solid #fde68a;
}
.veggie-selector-title {
  font-size: 0.68rem; font-weight: 700; letter-spacing: 0.07em;
  text-transform: uppercase; color: #92400e;
}
.veggie-selector-sub {
  font-size: 0.62rem; color: #d97706; margin-left: auto;
}
.veggie-option {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 11px 14px; cursor: pointer;
  transition: background .15s; border-bottom: 1px solid #fde68a;
  background: #fff;
}
.veggie-option:last-child { border-bottom: none; }
.veggie-option:hover { background: #fffbeb; }
.veggie-option.selected { background: #fffbeb; }
.veggie-opt-letter {
  width: 22px; height: 22px; border-radius: 50%;
  background: #fde68a; color: #92400e;
  font-size: 0.68rem; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 1px;
}
.veggie-option.selected .veggie-opt-letter {
  background: #f59e0b; color: #fff;
}
.veggie-opt-text { font-size: 0.85rem; color: var(--text-2); line-height: 1.5; flex: 1; }
.veggie-opt-check {
  font-size: 0.9rem; color: #d97706; margin-top: 2px;
  opacity: 0; transition: opacity .15s;
}
.veggie-option.selected .veggie-opt-check { opacity: 1; }

/* steps */
.steps-list { list-style: none; }
.step-item {
  display: flex; gap: 14px; padding: 12px 0;
  border-bottom: 1px solid var(--border);
  align-items: flex-start;
}
.step-item:last-child { border-bottom: none; }
.step-num {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--green-lt); color: var(--green);
  font-size: 0.72rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 2px;
  font-family: 'Playfair Display', serif;
}
.step-text { font-size: 0.875rem; color: var(--text-2); line-height: 1.6; }

/* veggie-card replaced by veggie-selector */

/* tip */
.tip-card {
  background: var(--orange-lt); border: 1px solid #fed7aa;
  border-radius: var(--r-sm); padding: 14px;
  font-size: 0.85rem; color: var(--orange); line-height: 1.6;
}
.tip-card::before { content: "💡 "; }

/* fav button */
.fav-btn {
  display: block; width: calc(100% - 48px); margin: 16px 24px 0;
  background: none; border: 1px solid var(--border);
  border-radius: var(--r-sm); color: var(--text-3);
  font-size: 0.85rem; font-weight: 500; padding: 11px;
  transition: all .2s; text-align: center;
}
.fav-btn:hover { border-color: var(--fav); color: var(--fav); }
.fav-btn.active { background: #fffbeb; border-color: var(--fav); color: var(--fav); }

/* ── SHOPPING ── */
.shop-header-row {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 24px;
}
.clear-btn {
  background: none; border: 1px solid var(--border);
  border-radius: var(--r-xs); color: var(--text-4);
  font-size: 0.78rem; padding: 6px 14px; transition: all .15s;
}
.clear-btn:hover { border-color: var(--orange); color: var(--orange); }
.shop-cat { margin-bottom: 28px; }
.shop-cat-title {
  font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text-4);
  padding-bottom: 10px; border-bottom: 1px solid var(--border); margin-bottom: 10px;
}
.shop-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px; border-radius: var(--r-sm);
  cursor: pointer; transition: background .12s;
  font-size: 0.875rem; color: var(--text-2);
  border: 1px solid transparent; margin-bottom: 4px;
}
.shop-item:hover { background: var(--surface2); }
.shop-item.checked { opacity: .45; color: var(--text-4); }
.shop-item.checked .shop-item-text { text-decoration: line-through; }
.check-circle {
  width: 20px; height: 20px; border: 2px solid var(--border-md);
  border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.65rem; transition: all .15s; color: transparent;
}
.shop-item.checked .check-circle {
  background: var(--green); border-color: var(--green); color: #fff;
}
.shop-item-text { flex: 1; }

/* ── BATCH COOKING ── */
.batch-section { margin-bottom: 32px; }
.batch-week-title {
  font-family: 'Playfair Display', serif;
  font-size: 1rem; font-weight: 600; color: var(--text);
  margin-bottom: 14px; padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.batch-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 11px 14px; border-radius: var(--r-sm);
  cursor: pointer; transition: all .12s;
  font-size: 0.875rem; color: var(--text-2);
  border: 1px solid var(--border); margin-bottom: 6px;
  background: var(--surface); line-height: 1.5;
}
.batch-item:hover { background: var(--surface2); }
.batch-item.done { opacity: .45; }
.batch-item.done .batch-text { text-decoration: line-through; }

/* ── FAVORITES ── */
.favs-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px;
}
.fav-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 16px 18px; cursor: pointer;
  transition: all .2s; box-shadow: var(--shadow-sm);
}
.fav-card:hover { box-shadow: var(--shadow); border-color: var(--green); }
.fav-card-name { font-size: 0.9rem; font-weight: 500; color: var(--text); margin: 6px 0 4px; line-height: 1.3; }
.fav-card-meta { font-size: 0.73rem; color: var(--text-4); }
.fav-empty { text-align: center; padding: 80px 20px; color: var(--text-4); }
.fav-empty-icon { font-size: 2.5rem; display: block; margin-bottom: 12px; }

/* ── SEARCH OVERLAY ── */
#search-panel {
  display: none; position: fixed; inset: 0; z-index: 300;
  background: var(--bg); overflow-y: auto; padding: 24px;
}
#search-panel.open { display: block; }
.search-panel-header {
  display: flex; align-items: center; gap: 16px; margin-bottom: 24px;
}
.search-back {
  background: none; border: 1px solid var(--border); border-radius: var(--r-xs);
  color: var(--text-3); font-size: 0.85rem; padding: 8px 14px; transition: all .15s;
}
.search-back:hover { background: var(--surface2); color: var(--text); }
.search-count { font-size: 0.8rem; color: var(--text-4); }
.search-result {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-sm); padding: 14px 16px; margin-bottom: 8px;
  cursor: pointer; transition: all .15s;
}
.search-result:hover { border-color: var(--green); background: var(--green-lt); }
.search-result-name { font-size: 0.9rem; font-weight: 500; color: var(--text); margin: 5px 0 3px; }
.search-result-match { font-size: 0.75rem; color: var(--green); }
.no-results { text-align: center; padding: 60px; color: var(--text-4); }

/* ── MISC ── */
.badge {
  font-size: 0.62rem; font-weight: 600; letter-spacing: 0.05em;
  text-transform: uppercase; padding: 2px 7px; border-radius: 4px;
  display: inline-block;
}

/* ── MOBILE OVERRIDES ── */
@media (max-width: 767px) {
  .sidebar {
    display: none;
  }
  .mobile-header {
    display: flex !important;
  }
  .main-content {
    height: auto;
    overflow-y: visible;
    padding-bottom: 72px;
  }
  .content-header { padding: 16px 20px; }
  .content-body   { padding: 20px 16px; }
  .plan-grid { grid-template-columns: 1fr; }
  .ingr-cols { grid-template-columns: 1fr 1fr; }
  .favs-grid { grid-template-columns: 1fr; }
  .mobile-bottom-nav { display: flex !important; }
}

/* ── MOBILE HEADER (hidden on desktop) ── */
.mobile-header {
  display: none;
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 14px 20px 10px; position: sticky; top: 0; z-index: 50;
  align-items: center; gap: 12px;
}
.mobile-brand {
  font-family: 'Playfair Display', serif; font-size: 1rem;
  font-weight: 600; color: var(--green); flex: 1;
}
.mobile-week-tabs {
  display: flex; gap: 4px; padding: 10px 20px 0;
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.mobile-week-tab {
  flex: 1; background: none; border: none;
  border-bottom: 2px solid transparent; padding: 6px 4px 10px;
  font-size: 0.72rem; font-weight: 600; color: var(--text-4);
  letter-spacing: 0.04em; text-transform: uppercase; transition: all .15s;
}
.mobile-week-tab.active { color: var(--green); border-bottom-color: var(--green); }

/* ── MOBILE BOTTOM NAV ── */
.mobile-bottom-nav {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 4px 0 env(safe-area-inset-bottom, 0);
  z-index: 50;
}
.mob-nav-btn {
  flex: 1; background: none; border: none; color: var(--text-4);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 7px 4px; font-size: 0.58rem; font-weight: 500;
  letter-spacing: 0.04em; text-transform: uppercase; transition: color .15s;
}
.mob-nav-btn .ico { font-size: 1.2rem; line-height: 1; }
.mob-nav-btn.active { color: var(--green); }

/* ── PLATE CHART ── */
.plate-chart-section {
  padding: 20px 24px 0;
}
.plate-chart-wrap {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--r-sm); padding: 16px;
  display: flex; align-items: center; gap: 20px;
}
.plate-donut { flex-shrink: 0; position: relative; width: 110px; height: 110px; }
.plate-donut svg { width: 110px; height: 110px; transform: rotate(-90deg); }
.plate-donut-label {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  font-size: 0.62rem; color: var(--text-3); text-align: center;
  line-height: 1.2;
}
.plate-donut-label strong { font-size: 1rem; color: var(--text); font-weight: 600; display: block; }
.plate-legend { flex: 1; display: flex; flex-direction: column; gap: 7px; }
.legend-row {
  display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--text-2);
}
.legend-dot {
  width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0;
}
.legend-pct { margin-left: auto; font-weight: 600; font-size: 0.78rem; color: var(--text-3); }

</style>
</head>

function getRecipe(key) {
  if (desayunos[key]) return { ...desayunos[key], _type:'D',  _key:key };
  if (comidas[key])   return { ...comidas[key],   _type:'C',  _key:key };
  if (meriendas[key]) return { ...meriendas[key], _type:'M',  _key:key };
  if (cenas[key])     return { ...cenas[key],     _type:'CE', _key:key };
  return null;
}
function typeName(t) { return {D:'Desayuno',C:'Comida',M:'Merienda',CE:'Cena'}[t]||t; }
function shortName(n) { return n.replace(/^[A-Z]+\d+[A-Z]?\.\s*/,''); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function isDone(k) { return !!state.done[k]; }
function isFav(k)  { return !!state.favs[k]; }

  el.innerHTML = weeks.map((w,i) =>
    `<button class="nav-btn ${i===currentWeek?'active':''}" id="wk-btn-${i}" onclick="selectWeek(${i})">
      <span class="icon">📆</span> ${w.label.charAt(0)+w.label.slice(1).toLowerCase()}
    </button>`
  ).join('');
}

function buildMobileWeekTabs() {
  const isMob = window.innerWidth < 768;
  const el = document.getElementById('mobile-week-tabs');
  if (!isMob) { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  el.innerHTML = weeks.map((w,i) =>
    `<button class="mobile-week-tab ${i===currentWeek?'active':''}" onclick="selectWeek(${i})">${w.label.replace('SEMANA ','S')}</button>`
  ).join('');
}

function selectWeek(i) {
  currentWeek = i;
  buildSidebarWeeks();
  buildMobileWeekTabs();
  updateContentHeader();
  if (currentView === 'plan')  renderPlan();
  if (currentView === 'shop')  renderShop();
  if (currentView === 'batch') renderBatch();
}

function updateContentHeader() {
  const wk = weeks[currentWeek];
  const viewNames = {plan:'Plan semanal', shop:'Lista de la compra', batch:'Batch cooking domingo', favs:'Mis favoritos'};
  document.getElementById('content-breadcrumb').textContent = viewNames[currentView] || '';
  document.getElementById('content-title').textContent =
    currentView === 'favs' ? 'Favoritos' : wk.label.charAt(0)+wk.label.slice(1).toLowerCase();
}

// ═══════════════════════════════════════════════════════
// PLAN VIEW
// ═══════════════════════════════════════════════════════
function renderPlan() {
  const wk = weeks[currentWeek];
  const container = document.getElementById('plan-days');
  container.innerHTML = wk.days.map(day => {
    const keys = [day.breakfast, day.lunch, day.snack, day.dinner];
    const doneCount = keys.filter(k => isDone(k)).length;
    const rows = MEAL_FIELDS.map((mt, idx) => {
      const key = keys[idx];
      const r = getRecipe(key);
      const name = r ? shortName(r.n) : key;
      const done = isDone(key), fav = isFav(key);
      const T = r ? r._type : 'C';
      return `
        <div class="meal-row ${done?'done':''}" onclick="openRecipe('${esc(key)}')">
          <div class="meal-type-col">
            <span class="meal-type-badge badge-${T}">${mt.label}</span>
          </div>
          <div class="meal-info">
            <div class="meal-title">${esc(name)}</div>
            <div class="meal-code">${esc(key)}</div>
          </div>
          <div class="meal-actions" onclick="event.stopPropagation()">
            <button class="action-btn ${done?'done-active':''}"
              onclick="toggleMealDone('${esc(key)}')">${done?'✓':'·'}</button>
            <button class="action-btn ${fav?'fav-active':''}"
              onclick="toggleMealFav('${esc(key)}')">${fav?'★':'☆'}</button>
          </div>
        </div>`;
    }).join('');
    return `
      <div class="day-card">
        <div class="day-header">
          <div class="day-name">${day.day}</div>
          <div class="day-done">${doneCount}/4</div>
        </div>
        <div class="meals-list">${rows}</div>
      </div>`;
  }).join('');
}

function toggleMealDone(key) { state.done[key] = !state.done[key]; saveState(state); renderPlan(); }
function toggleMealFav(key)  { state.favs[key] = !state.favs[key]; saveState(state); renderPlan(); if (currentView==='favs') renderFavs(); }

// ═══════════════════════════════════════════════════════
// RECIPE DRAWER
// ═══════════════════════════════════════════════════════
let currentRecipeKey = null;

function openRecipe(key) {
  const r = getRecipe(key);
  if (!r) return;
  currentRecipeKey = key;
  document.getElementById('recipe-content').innerHTML = buildRecipeHTML(r);
  restoreVeggieChoices(key);
  document.getElementById('recipe-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function selectVeggie(el, idx, key) {
  // Toggle selection visually and persist choice
  const parent = el.closest('.veggie-selector');
  parent.querySelectorAll('.veggie-option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  state.veggies[key] = idx;
  saveState(state);
}

function restoreVeggieChoices(key) {
  const saved = state.veggies && state.veggies[key];
  if (saved === undefined) return;
  const opt = document.getElementById('vopt-' + saved + '-' + key);
  if (opt) opt.classList.add('selected');
}

function closeRecipe() {
  document.getElementById('recipe-modal').classList.remove('open');
  document.body.style.overflow = '';
  currentRecipeKey = null;
}
function closeRecipeIfBg(e) {
  if (e.target === document.getElementById('recipe-modal')) closeRecipe();
}
function toggleRecipeFav() {
  if (!currentRecipeKey) return;
  state.favs[currentRecipeKey] = !state.favs[currentRecipeKey];
  saveState(state);
  const btn = document.querySelector('.fav-btn');
  if (btn) {
    const f = isFav(currentRecipeKey);
    btn.textContent = f ? '★  Guardado en favoritos' : '☆  Guardar en favoritos';
    btn.classList.toggle('active', f);
  }
  if (currentView === 'favs') renderFavs();
  renderPlan();
}

// ── PLATE DONUT CHART ────────────────────────────────────────────
// Estimates macro distribution from recipe data
function buildPlateChart(r) {
  if (r._type === 'D' || r._type === 'M') return ''; // only comidas & cenas

  // Classify ingredients into groups for Raúl (representative)
  const allIngr = [...(r.iR||[]), ...(r.shared||[])].join(' ').toLowerCase();

  // Protein estimate (g)
  const prot = r.pR || 0;
  // HC estimate from key carb ingredients
  let hcScore = 0;
  if (allIngr.includes('pasta')||allIngr.includes('fideos')) hcScore += 35;
  if (allIngr.includes('arroz')) hcScore += 35;
  if (allIngr.includes('patata')) hcScore += 30;
  if (allIngr.includes('boniato')) hcScore += 28;
  if (allIngr.includes('quinoa')) hcScore += 32;
  if (allIngr.includes('legumbre')||allIngr.includes('garbanzo')||allIngr.includes('lenteja')||allIngr.includes('alubia')) hcScore += 22;
  if (allIngr.includes('pan')||allIngr.includes('fajita')||allIngr.includes('tortita')) hcScore += 18;
  if (allIngr.includes('avena')) hcScore += 20;

  // Fat estimate
  let fatScore = 0;
  if (allIngr.includes('salmón')||allIngr.includes('caballa')||allIngr.includes('sardina')||allIngr.includes('atún fresco')) fatScore += 18;
  if (allIngr.includes('aguacate')) fatScore += 14;
  if (allIngr.includes('fruto seco')||allIngr.includes('nuez')||allIngr.includes('almendra')) fatScore += 12;
  if (allIngr.includes('queso')) fatScore += 10;
  if (allIngr.includes('aceite')||allIngr.includes('aove')) fatScore += 8;
  if (allIngr.includes('huevo')) fatScore += 8;
  if (allIngr.includes('coco')) fatScore += 12;
  fatScore = Math.min(fatScore, 35);

  // Veggie fill (remainder) — always at least 30%
  const protKcal = prot * 4;
  const hcKcal   = hcScore * 4;
  const fatKcal  = fatScore * 9;
  const total = r.kR || 500;

  // Compute % of plate
  let pProt = Math.round((protKcal / total) * 100);
  let pHC   = Math.round((hcKcal   / total) * 100);
  let pFat  = Math.round((fatKcal  / total) * 100);
  let pVeg  = Math.max(100 - pProt - pHC - pFat, 10);

  // Normalise to 100
  const sum = pProt + pHC + pFat + pVeg;
  const scale = 100 / sum;
  pProt = Math.round(pProt * scale);
  pHC   = Math.round(pHC   * scale);
  pFat  = Math.round(pFat  * scale);
  pVeg  = 100 - pProt - pHC - pFat;

  // SVG donut
  const R = 40, cx = 55, cy = 55, stroke = 18;
  const circ = 2 * Math.PI * R;
  const segments = [
    { pct: pProt, color: '#3b82f6', label: 'Proteína' },
    { pct: pHC,   color: '#f59e0b', label: 'Hidratos' },
    { pct: pVeg,  color: '#22c55e', label: 'Verdura'  },
    { pct: pFat,  color: '#f97316', label: 'Grasa'    },
  ];

  let offset = 0;
  const circles = segments.map(seg => {
    const dash = (seg.pct / 100) * circ;
    const gap  = circ - dash;
    const el   = `<circle cx="${cx}" cy="${cy}" r="${R}"
      fill="none" stroke="${seg.color}" stroke-width="${stroke}"
      stroke-dasharray="${dash.toFixed(1)} ${gap.toFixed(1)}"
      stroke-dashoffset="${(-offset * circ / 100).toFixed(1)}"
      stroke-linecap="butt"/>`;
    offset += seg.pct;
    return el;
  }).join('');

  const legendRows = segments.map(s =>
    `<div class="legend-row">
      <span class="legend-dot" style="background:${s.color}"></span>
      <span>${s.label}</span>
      <span class="legend-pct">${s.pct}%</span>
    </div>`
  ).join('');

  return `<div class="plate-chart-section">
    <div class="ds-label">Distribución del plato · Raúl</div>
    <div class="plate-chart-wrap">
      <div class="plate-donut">
        <svg viewBox="0 0 110 110">${circles}</svg>
        <div class="plate-donut-label">
          <strong>${r.kR}</strong>kcal
        </div>
      </div>
      <div class="plate-legend">${legendRows}</div>
    </div>
  </div>`;
}

function buildRecipeHTML(r) {
  const fav = isFav(r._key);

  // Detailed step descriptions
  const stepDetails = {
    "Pochar": "Calentar el AOVE a fuego medio-bajo. Sofreír hasta que esté transparente y suave, sin dorar.",
    "Dorar": "Subir a fuego medio-alto. La proteína debe quedar sellada por fuera (color dorado) pero jugosa por dentro.",
    "Al vapor": "Colocar en cesta de vapor sobre agua hirviendo. Tapar bien para que el vapor no escape.",
    "Plancha": "Sartén o plancha muy caliente, con unas gotas de AOVE. No mover la pieza hasta que se despegue sola.",
    "Hornear": "Horno precalentado. No abrir durante los primeros 2/3 del tiempo para no perder temperatura.",
  };

  let html = `
    <div class="drawer-header">
      <div class="drawer-title">${esc(shortName(r.n))}</div>
      <button class="drawer-close" onclick="closeRecipe()">✕</button>
    </div>
    <div class="drawer-meta">
      <span class="meta-pill time">⏱ ${esc(r.t||'–')}</span>
      <span class="meta-pill raul">Raúl · ${r.kR} kcal · ${r.pR}g proteína</span>
      <span class="meta-pill carmen">Carmen · ${r.kC} kcal · ${r.pC}g proteína</span>
    </div>`;

  // ── PLATE CHART ──────────────────────────────────────────────────
  html += buildPlateChart(r);

  // ── INGREDIENTS BLOCK ──────────────────────────────────────────
  if (r.iR || r.iC) {
    html += `<div class="drawer-section">
      <div class="ds-label">Ingredientes</div>
      <div class="ingr-cols">`;

    // Raúl column
    if (r.iR) html += `<div class="ingr-col raul-col">
      <div class="ingr-person-header r">
        <div class="ingr-person-avatar r">R</div>
        <div class="ingr-person-name r">Raúl</div>
        <div class="ingr-person-kcal">${r.kR} kcal</div>
      </div>
      <div class="ingr-list">
        ${(r.iR||[]).filter(i=>i).map(i=>`
          <div class="ingr-item">
            <span class="ingr-dot r"></span><span style="margin-right:5px">${ingredEmoji(i)}</span>${esc(i)}
          </div>`).join('')}
      </div>
    </div>`;

    // Carmen column
    if (r.iC) html += `<div class="ingr-col carmen-col">
      <div class="ingr-person-header c">
        <div class="ingr-person-avatar c">C</div>
        <div class="ingr-person-name c">Carmen</div>
        <div class="ingr-person-kcal">${r.kC} kcal</div>
      </div>
      <div class="ingr-list">
        ${(r.iC||[]).filter(i=>i).map(i=>`
          <div class="ingr-item">
            <span class="ingr-dot c"></span><span style="margin-right:5px">${ingredEmoji(i)}</span>${esc(i)}
          </div>`).join('')}
      </div>
    </div>`;

    html += `</div>`;

    // Shared ingredients — table style with equal-badge
    if (r.shared && r.shared.length) {
      const sharedRows = r.shared.map(s => {
        const emoji = s.includes('AOVE')||s.includes('aceite') ? '🫒' :
                      s.includes('ajo')                        ? '🧄' :
                      s.includes('cebolla')                   ? '🧅' :
                      s.includes('tomate')                    ? '🍅' :
                      s.includes('limón')                     ? '🍋' :
                      s.includes('sal')||s.includes('pimienta')? '🧂' :
                      s.includes('brócoli')||s.includes('judía')||s.includes('espinaca') ? '🥦' :
                      s.includes('zanahoria')                 ? '🥕' :
                      s.includes('champiñ')||s.includes('seta')? '🍄' :
                      s.includes('caldo')                     ? '🍲' :
                      s.includes('vinagre')||s.includes('soja')? '🍶' :
                      '·';
        return `<tr>
          <td style="color:var(--text-4);font-size:.85rem">${emoji}</td>
          <td>${esc(s)}</td>
          <td><span class="shared-equal-badge">= 2</span></td>
        </tr>`;
      }).join('');
      html += `<div class="shared-block">
        <div class="shared-header">
          <span class="shared-header-icon">🤝</span>
          <span class="shared-header-text">Ingredientes comunes</span>
          <span class="shared-header-sub">misma cantidad para los dos</span>
        </div>
        <table class="shared-table"><tbody>${sharedRows}</tbody></table>
      </div>`;
    }

    // Veggie selector — INSIDE ingredients section, right after shared
    if (r.veggies && r.veggies.length === 2) {
      html += `<div class="veggie-selector">
        <div class="veggie-selector-header">
          <span style="font-size:.9rem">🥗</span>
          <span class="veggie-selector-title">Verdura / acompañamiento</span>
          <span class="veggie-selector-sub">Elige una opción</span>
        </div>
        <div class="veggie-option" onclick="selectVeggie(this,0,'${r._key}')" id="vopt-0-${esc(r._key)}">
          <div class="veggie-opt-letter">A</div>
          <div class="veggie-opt-text">${esc(r.veggies[0])}</div>
          <div class="veggie-opt-check">✓</div>
        </div>
        <div class="veggie-option" onclick="selectVeggie(this,1,'${r._key}')" id="vopt-1-${esc(r._key)}">
          <div class="veggie-opt-letter">B</div>
          <div class="veggie-opt-text">${esc(r.veggies[1])}</div>
          <div class="veggie-opt-check">✓</div>
        </div>
      </div>`;
      // restore saved veggie choice
      const savedV = state.veggies && state.veggies[r._key];
      if (savedV !== undefined) {
        // will be applied after render via restoreVeggieChoice
      }
    }

    html += `</div>`; // close drawer-section
  }

  // Steps — enhanced
  if (r.steps && r.steps.length) {
    html += `<div class="drawer-section" style="margin-top:6px">
      <div class="ds-label">Elaboración paso a paso</div>
      <ol class="steps-list">`;
    r.steps.forEach((s, i) => {
      // Find any matching tip for first keyword of this step
      const firstWord = s.split(' ')[0];
      const tip = Object.entries(stepDetails).find(([k]) => s.includes(k));
      html += `<li class="step-item">
        <span class="step-num">${i+1}</span>
        <div class="step-text">
          <strong>${esc(s)}</strong>
          ${tip ? `<div style="font-size:.78rem;color:var(--text-4);margin-top:4px;font-style:italic">${esc(tip[1])}</div>` : ''}
        </div>
      </li>`;
    });
    html += `</ol></div>`;
  } else if ((r._type==='D'||r._type==='M') && r.prep) {
    html += `<div class="drawer-section" style="margin-top:6px">
      <div class="ds-label">Preparación</div>
      <p style="font-size:.875rem;color:var(--text-2);line-height:1.7">${esc(r.prep)}</p>
    </div>`;
  }

  // Veggies now rendered inside ingredient block above

  // Tip
  if (r.extra) {
    html += `<div class="drawer-section" style="margin-top:6px">
      <div class="tip-card">${esc(r.extra)}</div>
    </div>`;
  }

  // Fav
  html += `<button class="fav-btn ${fav?'active':''}" onclick="toggleRecipeFav()">
    ${fav ? '★  Guardado en favoritos' : '☆  Guardar en favoritos'}
  </button>`;

  html += `<div style="height:32px"></div>`;
  return html;
}

// SHOPPING
// ═══════════════════════════════════════════════════════
const SHOP_CATS = [
  ['verduras','🥦 Verduras y hortalizas'],
  ['frutas','🍎 Frutas'],
  ['proteinas','🍗 Carnes y proteínas'],
  ['pescados','🐟 Pescados y mariscos'],
  ['lacteos','🥛 Lácteos'],
  ['conservas','🥫 Conservas'],
  ['congelados','❄️ Congelados'],
  ['cereales','🌾 Cereales e integrales'],
  ['condimentos','🫙 Condimentos'],
];

function renderShop() {
  const wk = weeks[currentWeek];
  const wKey = `w${currentWeek}`;
  let html = '';
  SHOP_CATS.forEach(([cat,label]) => {
    const items = wk.shopping[cat]||[];
    if (!items.length) return;
    html += `<div class="shop-cat"><div class="shop-cat-title">${label}</div>`;
    items.forEach((item,idx) => {
      const key = `${wKey}_${cat}_${idx}`;
      const chk = !!state.shop[key];
      html += `<div class="shop-item ${chk?'checked':''}" onclick="toggleShop('${wKey}','${cat}',${idx})">
        <div class="check-circle">${chk?'✓':''}</div>
        <span class="shop-item-text">${esc(item)}</span>
      </div>`;
    });
    html += `</div>`;
  });
  document.getElementById('shop-content').innerHTML = html;
}

document.getElementById('clear-shop-btn').onclick = () => {
  const wKey = `w${currentWeek}`;
  Object.keys(state.shop).filter(k=>k.startsWith(wKey)).forEach(k=>delete state.shop[k]);
  saveState(state); renderShop();
};

function toggleShop(wKey,cat,idx) {
  const key=`${wKey}_${cat}_${idx}`;
  state.shop[key]=!state.shop[key];
  saveState(state); renderShop();
}

// ═══════════════════════════════════════════════════════
// BATCH COOKING
// ═══════════════════════════════════════════════════════
function renderBatch() {
  const wk = weeks[currentWeek];
  const wKey = `batch_w${currentWeek}`;
  let html = `<div class="batch-section">
    <div class="batch-week-title">🍳 Qué preparar el domingo — ${wk.label.charAt(0)+wk.label.slice(1).toLowerCase()}</div>`;
  (wk.batch||[]).forEach((item,idx) => {
    const key = `${wKey}_${idx}`;
    const done = !!state.batch[key];
    html += `<div class="batch-item ${done?'done':''}" onclick="toggleBatch('${wKey}',${idx})">
      <div class="check-circle" style="border-radius:50%">${done?'✓':''}</div>
      <span class="batch-text">${esc(item)}</span>
    </div>`;
  });
  html += `</div>`;
  document.getElementById('batch-content').innerHTML = html;
}

function toggleBatch(wKey,idx) {
  const key=`${wKey}_${idx}`;
  state.batch[key]=!state.batch[key];
  saveState(state); renderBatch();
}

// ═══════════════════════════════════════════════════════
// FAVORITES
// ═══════════════════════════════════════════════════════
function renderFavs() {
  const favKeys = Object.keys(state.favs).filter(k=>state.favs[k]);
  const container = document.getElementById('favs-content');
  if (!favKeys.length) {
    container.innerHTML = `<div class="fav-empty" style="grid-column:1/-1">
      <span class="fav-empty-icon">⭐</span>
      Aún no tienes favoritos.<br>Toca ☆ en cualquier plato para guardarlo aquí.
    </div>`; return;
  }
  container.innerHTML = favKeys.map(key => {
    const r=getRecipe(key); if(!r) return '';
    const T=r._type;
    return `<div class="fav-card" onclick="openRecipe('${esc(key)}')">
      <span class="badge badge-${T}" style="font-size:.6rem;padding:2px 7px;border-radius:4px;
        background:${T==='D'?'#eff6ff':T==='C'?'#f0fdf4':T==='M'?'#fffbeb':'#fdf4ff'};
        color:${T==='D'?'#1e40af':T==='C'?'#166534':T==='M'?'#92400e':'#6b21a8'}">${typeName(T)}</span>
      <div class="fav-card-name">${esc(shortName(r.n))}</div>
      <div class="fav-card-meta">${r.kR} kcal Raúl · ${r.kC} kcal Carmen · ⏱ ${r.t||'–'}</div>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════════════════════
function getAllRecipes() {
  const all=[];
  [[desayunos,'D'],[comidas,'C'],[meriendas,'M'],[cenas,'CE']].forEach(([db,t])=>{
    Object.entries(db).forEach(([k,r])=>all.push({...r,_key:k,_type:t}));
  });
  return all;
}

function doSearch(q) {
  if (!q.trim()) { closeSearch(); return; }
  document.getElementById('search-panel').classList.add('open');
  const all = getAllRecipes();
  const lq = q.toLowerCase();
  const results = all.filter(r => {
    return [r.n,...(r.iR||[]),...(r.iC||[]),...(r.shared||[]),...(r.steps||[])].join(' ').toLowerCase().includes(lq);
  });
  document.getElementById('search-count').textContent = results.length + ' resultado' + (results.length!==1?'s':'');
  const el = document.getElementById('search-results-list');
  if (!results.length) { el.innerHTML=`<div class="no-results">Sin resultados para "${esc(q)}"</div>`; return; }
  el.innerHTML = results.map(r => {
    const matches = [...(r.iR||[]),...(r.iC||[]),...(r.shared||[])].filter(i=>i.toLowerCase().includes(lq));
    return `<div class="search-result" onclick="openFromSearch('${esc(r._key)}')">
      <span class="badge" style="font-size:.6rem;padding:2px 7px;border-radius:4px;
        background:${r._type==='D'?'#eff6ff':r._type==='C'?'#f0fdf4':r._type==='M'?'#fffbeb':'#fdf4ff'};
        color:${r._type==='D'?'#1e40af':r._type==='C'?'#166534':r._type==='M'?'#92400e':'#6b21a8'}">${typeName(r._type)}</span>
      <div class="search-result-name">${esc(shortName(r.n))}</div>
      ${matches.length?`<div class="search-result-match">Contiene: ${matches.slice(0,3).map(esc).join(' · ')}</div>`:''}
    </div>`;
  }).join('');
}

function closeSearch() {
  document.getElementById('search-panel').classList.remove('open');
  document.getElementById('search-input').value = '';
  const mob = document.getElementById('search-input-mob');
  if (mob) mob.value = '';
}

function openFromSearch(key) {
  closeSearch(); openRecipe(key);
}

document.getElementById('search-input').addEventListener('input', function(){ doSearch(this.value); });
const mobInput = document.getElementById('search-input-mob');
if (mobInput) mobInput.addEventListener('input', function(){ doSearch(this.value); });

// ═══════════════════════════════════════════════════════
// VIEW SWITCHING
// ═══════════════════════════════════════════════════════
function switchView(name) {
  currentView = name;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  // Desktop sidebar
  ['plan','shop','batch','favs'].forEach(v=>{
    const b=document.getElementById('nav-'+v);
    if(b) b.classList.toggle('active', v===name);
  });
  // Mobile bottom nav
  ['plan','shop','batch','favs'].forEach(v=>{
    const b=document.getElementById('mob-nav-'+v);
    if(b) b.classList.toggle('active', v===name);
  });
  updateContentHeader();
  if (name==='shop')  renderShop();
  if (name==='batch') renderBatch();
  if (name==='favs')  renderFavs();
}

// ═══════════════════════════════════════════════════════
// RESPONSIVE: show/hide mobile elements
// ═══════════════════════════════════════════════════════
function handleResize() {
  const isMob = window.innerWidth < 768;
  document.getElementById('mobile-header').style.display = isMob ? 'flex' : 'none';
  document.getElementById('mobile-bottom-nav').style.display = isMob ? 'flex' : 'none';
  buildMobileWeekTabs();
}
window.addEventListener('resize', handleResize);

// ═══════════════════════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.key==='Escape') {
    if (document.getElementById('recipe-modal').classList.contains('open')) closeRecipe();
    else closeSearch();
  }
});

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
handleResize();
buildSidebarWeeks();
renderPlan();
</script>
</body>
</html>
